name: CI

# Runs on direct pushes to master (this repo's actual workflow) AND on PRs.
# This is the shared, enforceable guard the per-machine .claude Stop hook can
# never be: `npm run typecheck:all` type-checks BOTH src/ and the agent worker
# (backend/agents/worker.js via tsconfig.agents.json) — catching the
# "deleted a symbol, left the call site" ReferenceError class that took down
# every A2A agent in prod (ECIES_PUBKEY_LENGTH). `npm test` runs the capability
# + key-custody regression suite. To make this actually block regressions,
# also add it as a required status check in branch protection for master.
#
# The contracts job exists because the code that holds the money was the only
# part of the repo CI never looked at. An unauthenticated settlement path
# (completeVerificationWithTEE, which let any holder of any enclave signature
# release any submitted task's escrow) and a payment contract with no tests at
# all both shipped to master green. `npm test` there runs the Hardhat suite;
# `npm run check-addresses` re-derives backend/frontend contractAddresses.ts
# from deployments/*.json and fails when someone hand-edits the generated file
# instead of updating the deployment record.
#
# The packages job exists because sdk/ and mcp/ were the remaining blind spot,
# and it is the SAME failure class the backend job was created for: a change to
# a backend route's request shape was made along with the sdk wrapper, every
# covered package stayed green, and a third caller — mcp/src/tools.ts, which
# reaches the endpoint through the sdk wrapper rather than the URL — was left
# passing the old shape. Grepping for the route path does not find a caller that
# goes through a wrapper; a typecheck does. (A fourth caller,
# sdk/src/tools/helpers.ts, hid behind an `as any` and needed a grep even so —
# a typecheck is necessary, not sufficient.)
#
# cli/ joined when it became a thin layer over the sdk's spend paths
# (postTask, deployAgent, refunds): it is now a consumer of exactly the surface
# that changes, type-checked and tested against the local sdk like mcp.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            mcp/package-lock.json
            cli/package-lock.json
      # `build` is `tsc`, so this type-checks the sdk; `npm test` runs its unit
      # tests, including the fixture that checks it still decrypts what the
      # backend encrypts.
      - name: sdk — install, type-check and test
        working-directory: sdk
        run: |
          npm ci
          npm run build
          npm test
      # mcp depends on the PUBLISHED @blindmarket/sdk, so `npm ci` alone would
      # type-check it against the last release — which cannot catch drift
      # between the sdk source in this commit and its consumers, the whole
      # reason this job exists. Overriding with the local build (--no-save, so
      # package.json is untouched) asks the question that actually matters:
      # does mcp still compile against the sdk we are about to publish?
      # `npm test` builds first, so this still type-checks against the local
      # sdk — and then launches the built server over stdio the way a client
      # does. That second half is not redundant: the bug where the server
      # called process.exit(1) on a missing API key type-checked perfectly and
      # sat green in this job, while every user who added the server without a
      # key first got "CONNECTION_CLOSED" and no explanation. A compiler cannot
      # see a process that exits; launching it can.
      - name: mcp — type-check against the LOCAL sdk, then smoke-test over stdio
        working-directory: mcp
        run: |
          npm ci
          npm i --no-save ../sdk
          npm test
      # Same reasoning as mcp: the cli's lockfile holds the published sdk, and
      # the question is whether it works against the sdk in this commit. Its
      # tests run whole commands against production's recorded responses
      # (fixtures/prod) and a stub Arc node.
      - name: cli — type-check against the LOCAL sdk, then run its tests
        working-directory: cli
        run: |
          npm ci
          npm i --no-save ../sdk
          npm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
      # Drift guard: the committed address modules must still match what
      # deployments/*.json generates. Runs after the suite so a genuine test
      # failure is the first thing reported.
      - run: npm run check-addresses
