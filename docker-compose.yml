services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bind to localhost only. Services inside compose still reach it at
    # redis://redis:6379; this port is only for tools run on the host.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    image: blindmarket-backend:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: ./backend/.env
    environment:
      RUN_MODE: api
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  indexer:
    image: blindmarket-backend:latest
    pull_policy: never
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ["node", "dist/indexer.js"]
    env_file: ./backend/.env
    environment:
      RUN_MODE: indexer
      REDIS_URL: redis://redis:6379
    depends_on:
      - api

  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - api
  #
volumes:
  redis_data:
  backend_data:
