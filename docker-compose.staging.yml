services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blindmarket_staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blindmarket_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    image: blindmarket-backend:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    env_file: ./backend/.env
    environment:
      RUN_MODE: api
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-blindmarket_staging}?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  indexer:
    image: blindmarket-backend:latest
    pull_policy: never
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ["node", "dist/indexer.js"]
    env_file: ./backend/.env
    environment:
      RUN_MODE: indexer
      REDIS_URL: redis://redis:6379
    depends_on:
      - api

  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - api
  #
volumes:
  postgres_data:
  redis_data:
  backend_data:
