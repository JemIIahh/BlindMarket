services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    image: blindmarket-backend:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3002:3001"
    env_file: ./backend/.env
    environment:
      RUN_MODE: api
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  indexer:
    image: blindmarket-backend:latest
    pull_policy: never
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ["node", "dist/indexer.js"]
    env_file: ./backend/.env
    environment:
      RUN_MODE: indexer
      REDIS_URL: redis://redis:6379
    depends_on:
      - api

  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - api
  #
volumes:
  redis_data:
  backend_data:
